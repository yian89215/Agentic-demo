<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Essay Writer</title><link rel="stylesheet" href="/style.css"></head>
<body><header><strong>Essay Writer</strong><div><span id="runState"></span><button data-lang="zh-TW">中文</button><button data-lang="en">English</button></div></header><main>
<section class="card"><span class="eyebrow" data-t="inputHeading"></span><h1 data-t="hero"></h1><p data-t="subtitle"></p><form id="questionForm"><label for="question" data-t="topic"></label><div class="input-row"><textarea id="question" rows="3" required></textarea><button id="runButton" type="submit" data-t="start"></button></div><div class="settings"><label for="revisions" data-t="limit"></label><select id="revisions"><option value="0">0</option><option value="1" selected>1</option><option value="2">2</option></select><span data-t="limitHelp"></span></div></form><div class="examples"><span data-t="examples"></span><div id="exampleButtons"></div></div></section>
<section class="card"><span class="eyebrow" data-t="flowHeading"></span><h2 data-t="flowTitle"></h2><p data-t="flowHelp"></p><div class="flow-actions"><span id="revisionCount"></span><div><button id="downloadButton" disabled data-t="download"></button><label class="import"><span data-t="import"></span><input id="uploadInput" type="file" accept=".json,application/json"></label></div></div><div class="graph-scroll"><div class="graph"><svg viewBox="0 0 1060 330" aria-hidden="true"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="currentColor"/></marker></defs><path class="solid" d="M45 85 H100 M280 85 H330 M510 85 H560 M650 130 V220 H790"/><path class="conditional" d="M970 265 H1030 V85 M790 265 H420 V130 M420 130 V185"/><path class="zero-only" d="M740 85 H1030"/></svg><span class="endpoint start">Start</span><span class="endpoint end">End</span><button class="node" data-node="planner" style="left:100px;top:40px"><strong>Planning</strong><small data-t="planningDesc"></small><em></em></button><button class="node" data-node="research_plan" style="left:330px;top:40px"><strong>Research</strong><small data-t="researchDesc"></small><em></em></button><button class="node" data-node="generate" style="left:560px;top:40px"><strong>Write</strong><small data-t="writeDesc"></small><em></em></button><button class="node" data-node="reflect" style="left:790px;top:220px"><strong>Review</strong><small data-t="reviewDesc"></small><em></em></button><div class="tool-node"><strong>MCP Tools</strong><small data-t="toolsDesc"></small></div><span class="branch finish" data-t="finish"></span><span class="branch revise" data-t="revise"></span><span class="branch zero" data-t="zeroRoute"></span></div></div></section>
<section class="card"><span class="eyebrow" data-t="resultsHeading"></span><h2 data-t="resultsTitle"></h2><div class="tabs" role="tablist"><button role="tab" data-tab="planner">Planning</button><button role="tab" data-tab="research_plan">Research</button><button role="tab" data-tab="generate">Write</button><button role="tab" data-tab="reflect">Review</button></div><div id="result" role="tabpanel"></div></section>
<div id="replayPanel" class="replay" hidden><strong data-t="replay"></strong><span id="replayLabel"></span><button id="replayButton" data-t="play"></button><button id="stepButton" data-t="next"></button><button id="resetButton" data-t="reset"></button><span id="replayProgress"></span></div></main><script src="/app.js" defer></script></body></html>
